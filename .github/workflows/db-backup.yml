name: Daily MongoDB Backup to Google Drive

# Dumps the production MongoDB database from the VPS and uploads a compressed
# archive to Google Drive once per day.
#
# How it works:
#   1. GitHub Actions connects to the VPS over SSH (same credentials as deploy.yml).
#   2. On the VPS, `mongodump` exports the `hawkstars` database to a gzipped archive.
#   3. The archive is uploaded to Google Drive using the existing Google OAuth
#      refresh token (the same Google app already used by the site), so no new
#      Google credentials are required — only a destination folder ID.
#   4. Backups older than RETENTION_DAYS are pruned from the Drive folder.
#   5. A Discord message reports the outcome — success OR failure. Without it a
#      scheduled job that starts failing is silent, and GitHub also disables
#      scheduled workflows after 60 days of repository inactivity without
#      telling anyone.
#
# Required GitHub secrets (most already exist from deploy.yml):
#   VPS_HOST, VPS_USERNAME, SSH_PRIVATE_KEY, SSH_PASSPHRASE   (VPS SSH access)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN  (Drive upload)
#   GDRIVE_BACKUP_FOLDER_ID   (the Google Drive folder to store backups in)
#   DISCORD_WEBHOOK_URL       (same secret deploy.yml uses; the notification is
#                              skipped, not failed, when it is unset)
#
# IMPORTANT: the Google OAuth client/refresh token must include the
#   https://www.googleapis.com/auth/drive.file  scope (or a broader Drive scope)
#   for the upload to succeed. If the existing refresh token was issued only for
#   Gmail/Nodemailer scopes, generate a new refresh token that includes Drive.

on:
  schedule:
    # 03:17 UTC every day (off-peak; avoids the top-of-hour cron congestion).
    - cron: '17 3 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  DB_NAME: hawkstars
  RETENTION_DAYS: '31'
  # Floor for a plausible dump. A gzipped archive of a populated CMS is far
  # bigger than this; anything under it is a truncated or empty dump that must
  # not be uploaded and must not push a real backup out of the retention window.
  MIN_ARCHIVE_BYTES: '102400'

jobs:
  backup:
    name: Dump database and upload to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Parsed out of the remote script's stdout by the "Extract summary" step
      # below, so the Discord message can name the archive rather than just
      # saying it worked.
      summary: ${{ steps.summary.outputs.json }}
    steps:
      - name: Dump MongoDB and upload to Google Drive
        id: dump
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
          DB_NAME: ${{ env.DB_NAME }}
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}
          MIN_ARCHIVE_BYTES: ${{ env.MIN_ARCHIVE_BYTES }}
          # Set this secret once Mongo authentication is enabled; until then the
          # dump falls back to the unauthenticated local URI.
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 25m
          # Needed for the BACKUP_SUMMARY line below to reach the notify job.
          capture_stdout: true
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REFRESH_TOKEN,GDRIVE_BACKUP_FOLDER_ID,DB_NAME,RETENTION_DAYS,MIN_ARCHIVE_BYTES,DATABASE_URI
          script: |
            set -euo pipefail

            # ----- preconditions -------------------------------------------------
            command -v mongodump >/dev/null 2>&1 || {
              echo "::error::mongodump not found on the VPS. Install MongoDB Database Tools:";
              echo "  https://www.mongodb.com/docs/database-tools/installation/installation-linux/";
              exit 1;
            }
            command -v curl >/dev/null 2>&1 || { echo "::error::curl is required"; exit 1; }
            command -v jq   >/dev/null 2>&1 || { echo "::error::jq is required (sudo apt-get install -y jq)"; exit 1; }

            : "${GOOGLE_CLIENT_ID:?missing}"; : "${GOOGLE_CLIENT_SECRET:?missing}"
            : "${GOOGLE_REFRESH_TOKEN:?missing}"; : "${GDRIVE_BACKUP_FOLDER_ID:?missing}"

            # ----- dump ----------------------------------------------------------
            WORKDIR="$(mktemp -d /tmp/hawkstars-backup.XXXXXX)"
            trap 'rm -rf "$WORKDIR"' EXIT
            STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
            ARCHIVE="$WORKDIR/${DB_NAME}-${STAMP}.gz"

            echo "Dumping database '${DB_NAME}' to ${ARCHIVE} ..."
            mongodump --uri="${DATABASE_URI:-mongodb://localhost:27017/${DB_NAME}}" \
              --archive="$ARCHIVE" --gzip
            SIZE="$(du -h "$ARCHIVE" | cut -f1)"
            BYTES="$(stat -c%s "$ARCHIVE")"
            echo "Dump complete (${SIZE}, ${BYTES} bytes)."

            # ----- validate the dump before it counts as a backup ----------------
            # mongodump exits 0 on an empty or partially-readable database, so
            # without these two checks a truncated archive was uploaded and
            # counted as good — while the retention prune below deleted the last
            # real one behind it.
            if [ "$BYTES" -lt "$MIN_ARCHIVE_BYTES" ]; then
              echo "::error::Dump is only ${BYTES} bytes (minimum ${MIN_ARCHIVE_BYTES}). Refusing to upload a probably-truncated backup."
              exit 1
            fi

            echo "Verifying the archive can be read back ..."
            if ! mongorestore --archive="$ARCHIVE" --gzip --dryRun --quiet; then
              echo "::error::mongorestore --dryRun could not read the archive. Refusing to upload."
              exit 1
            fi
            echo "Archive verified."

            # ----- get a fresh access token -------------------------------------
            echo "Requesting Google access token ..."
            ACCESS_TOKEN="$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d client_id="$GOOGLE_CLIENT_ID" \
              -d client_secret="$GOOGLE_CLIENT_SECRET" \
              -d refresh_token="$GOOGLE_REFRESH_TOKEN" \
              -d grant_type=refresh_token | jq -r '.access_token')"
            if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
              echo "::error::Failed to obtain Google access token. Check the OAuth secrets and Drive scope."
              exit 1
            fi

            # ----- upload (resumable) -------------------------------------------
            # Was uploadType=multipart despite the comment claiming resumable.
            # Google documents multipart for files of 5 MB or less; the whole
            # archive was buffered into one request with no resume point, which
            # works until the database grows and then fails silently.
            FILENAME="$(basename "$ARCHIVE")"
            echo "Uploading ${FILENAME} (${SIZE}) to Google Drive folder ${GDRIVE_BACKUP_FOLDER_ID} ..."
            META="$(jq -n --arg name "$FILENAME" --arg parent "$GDRIVE_BACKUP_FOLDER_ID" \
              '{name: $name, parents: [$parent]}')"

            SESSION_URI="$(curl -s -D - -o /dev/null -X POST \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/gzip" \
              -H "X-Upload-Content-Length: ${BYTES}" \
              --data "$META" \
              | tr -d '\r' | awk 'tolower($1) == "location:" { print $2 }')"

            if [ -z "$SESSION_URI" ]; then
              echo "::error::Could not open a resumable upload session."
              exit 1
            fi

            UPLOAD_RESPONSE="$(curl -s --retry 5 --retry-delay 10 --retry-all-errors \
              -X PUT "$SESSION_URI" \
              -H "Content-Type: application/gzip" \
              -H "Content-Length: ${BYTES}" \
              --upload-file "$ARCHIVE")"

            FILE_ID="$(echo "$UPLOAD_RESPONSE" | jq -r '.id')"
            if [ -z "$FILE_ID" ] || [ "$FILE_ID" = "null" ]; then
              echo "::error::Upload failed. Response:"
              echo "$UPLOAD_RESPONSE"
              exit 1
            fi
            echo "Uploaded successfully. Drive file id: ${FILE_ID}"

            # ----- prune old backups --------------------------------------------
            echo "Pruning backups older than ${RETENTION_DAYS} days ..."
            CUTOFF="$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
            QUERY="'${GDRIVE_BACKUP_FOLDER_ID}' in parents and name contains '${DB_NAME}-' and createdTime < '${CUTOFF}' and trashed = false"
            ENCODED_QUERY="$(jq -rn --arg q "$QUERY" '$q|@uri')"

            OLD_IDS="$(curl -s -G "https://www.googleapis.com/drive/v3/files" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              --data-urlencode "q=${QUERY}" \
              --data-urlencode "fields=files(id,name)" \
              --data-urlencode "supportsAllDrives=true" \
              --data-urlencode "includeItemsFromAllDrives=true" | jq -r '.files[]?.id')"

            PRUNED=0
            if [ -n "$OLD_IDS" ]; then
              for ID in $OLD_IDS; do
                echo "Deleting old backup ${ID}"
                curl -s -X DELETE \
                  "https://www.googleapis.com/drive/v3/files/${ID}?supportsAllDrives=true" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" >/dev/null
                PRUNED=$((PRUNED + 1))
              done
            else
              echo "No backups older than ${RETENTION_DAYS} days to prune."
            fi

            echo "Backup workflow finished."

            # ----- summary for the Discord notification --------------------------
            # One machine-readable line the runner greps out of the captured
            # stdout. Printed last so a failure earlier in the script (which exits
            # non-zero under `set -e`) simply never emits it, and the notification
            # falls back to status-only.
            printf 'BACKUP_SUMMARY::%s\n' "$(jq -nc \
              --arg file "$FILENAME" \
              --arg size "$SIZE" \
              --arg drive_id "$FILE_ID" \
              --argjson pruned "$PRUNED" \
              '{file: $file, size: $size, drive_id: $drive_id, pruned: $pruned}')"

      - name: Extract summary
        id: summary
        # always(): when the dump fails there is no summary line, and the notify
        # job below still needs to run and say so.
        if: always()
        env:
          REMOTE_STDOUT: ${{ steps.dump.outputs.stdout }}
        run: |
          set -euo pipefail

          JSON="$(printf '%s' "${REMOTE_STDOUT:-}" \
            | grep -o 'BACKUP_SUMMARY::.*' \
            | tail -n 1 \
            | sed 's/^BACKUP_SUMMARY:://' || true)"

          # Validate before passing it on: a half-written line must not break the
          # notification, which is the thing that tells us the backup broke.
          if [ -z "${JSON}" ] || ! printf '%s' "${JSON}" | jq -e . >/dev/null 2>&1; then
            echo "No usable BACKUP_SUMMARY line in the remote output."
            JSON=''
          fi

          echo "json=${JSON}" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: backup
    # always(): the whole point is to hear about the runs that FAILED. A
    # scheduled workflow that only notifies on success is indistinguishable from
    # one that stopped running — and GitHub disables scheduled workflows after 60
    # days of repository inactivity without telling anyone.
    if: always()
    steps:
      - name: Send backup status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BACKUP_STATUS: ${{ needs.backup.result }}
          BACKUP_SUMMARY: ${{ needs.backup.outputs.summary }}
          DB_NAME: ${{ env.DB_NAME }}
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}
          TRIGGER: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL is not set — skipping Discord notification."
            exit 0
          fi

          case "${BACKUP_STATUS}" in
            success)   TITLE="✅ Database backup complete"; COLOR=3066993 ;;
            failure)   TITLE="❌ Database backup FAILED";   COLOR=15158332 ;;
            cancelled) TITLE="⚪ Database backup cancelled"; COLOR=9807270 ;;
            *)         TITLE="⚠️ Database backup skipped";  COLOR=16776960 ;;
          esac

          # The summary is only present on success — the remote script prints it
          # as its last statement, so any earlier failure (dump too small,
          # mongorestore --dryRun rejecting the archive, upload refused) exits
          # before it. Fall back to naming why there is nothing to report.
          if [ -n "${BACKUP_SUMMARY:-}" ]; then
            FILE="$(printf '%s' "${BACKUP_SUMMARY}" | jq -r '.file')"
            SIZE="$(printf '%s' "${BACKUP_SUMMARY}" | jq -r '.size')"
            DRIVE_ID="$(printf '%s' "${BACKUP_SUMMARY}" | jq -r '.drive_id')"
            PRUNED="$(printf '%s' "${BACKUP_SUMMARY}" | jq -r '.pruned')"
            DESCRIPTION="[\`${FILE}\`](https://drive.google.com/file/d/${DRIVE_ID}/view) · **${SIZE}**"
            PRUNE_TEXT="${PRUNED} removed (older than ${RETENTION_DAYS} days)"
          else
            DESCRIPTION="No archive was uploaded. Check the run log for which step stopped it — the dump size floor, the \`mongorestore --dryRun\` verification, or the Drive upload."
            PRUNE_TEXT="—"
          fi

          # jq builds the payload so a filename or error text containing quotes
          # or backslashes cannot produce invalid JSON.
          jq -n \
            --arg title "${TITLE}" \
            --argjson color "${COLOR}" \
            --arg description "${DESCRIPTION}" \
            --arg database "${DB_NAME}" \
            --arg trigger "${TRIGGER}" \
            --arg prune "${PRUNE_TEXT}" \
            --arg run_url "${RUN_URL}" \
            '{
              username: "HawkStars Backups",
              embeds: [{
                title: $title,
                color: $color,
                description: $description,
                fields: [
                  { name: "Database", value: $database, inline: true },
                  { name: "Trigger", value: $trigger, inline: true },
                  { name: "Retention", value: $prune, inline: true },
                  { name: "Links", value: "[Workflow run](\($run_url))" }
                ],
                timestamp: (now | todate)
              }]
            }' > payload.json

          # --fail-with-body so a rejected webhook (bad URL, rate limit) fails the
          # step loudly instead of passing silently — the same reasoning as the
          # deploy notification.
          curl --silent --show-error --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "${DISCORD_WEBHOOK_URL}"
