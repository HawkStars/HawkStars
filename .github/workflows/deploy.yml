name: Auto Deploy in VPS after Push in Production

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Two pushes to main a minute apart would otherwise give two concurrent SSH sessions
# doing `git reset --hard`, `pnpm install` and `pm2` against the same directory.
# Queue them instead of cancelling: a half-finished deploy must never be abandoned.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Check code quality
    runs-on: ubuntu-latest

    # `next build` prerenders routes that read from Payload, so the build needs a
    # reachable database. An empty throwaway Mongo is enough — nothing asserts on
    # the data, only that the queries resolve.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # docs https://pnpm.io/continuous-integration#github-actions
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      # Storybook builds every story for the browser. A story that reaches Payload's
      # server entry point fails the Chromatic build with an opaque Rollup
      # MISSING_EXPORT from `file-type` that names no story. This names the chain.
      - name: Check story import graph
        run: pnpm check:stories

      - name: Install Chromium for the Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Pipeline
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time only, and deliberately NOT real credentials.
          #
          # `payload.config.ts` asserts these at module load, so `next build` fails
          # before it renders anything without them — and because `next build` runs
          # with NODE_ENV=production, the Gmail OAuth block asserts too.
          #
          # Placeholders rather than secrets, for three reasons: this job also runs on
          # pull requests (where fork PRs get no secrets at all), nothing here needs a
          # credential that works, and the artifact is discarded — the VPS builds
          # again from its own .env. Note NEXT_PUBLIC_* values are inlined into the
          # bundle at build time, so this build is a compile gate, not a
          # production-equivalent artifact.
          DATABASE_URI: mongodb://127.0.0.1:27017/hawkstars-ci
          PAYLOAD_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          GOOGLE_EMAIL_USER: ci@example.invalid
          GOOGLE_NODEMAILER_CLIENT_ID: ci-placeholder
          GOOGLE_NODEMAILER_CLIENT_SECRET: ci-placeholder
          GOOGLE_NODEMAILER_REFRESH_TOKEN: ci-placeholder
  deploy:
    name: Deploy project with Nginx
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: '${{ github.token }}'
          environment: production

      - name: Set up SSH Key and Deploy my App on Server
        # run: |
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_EMAIL_USER: ${{ secrets.GOOGLE_EMAIL_USER }}
          GOOGLE_NODEMAILER_CLIENT_ID: ${{ secrets.GOOGLE_NODEMAILER_CLIENT_ID }}
          GOOGLE_NODEMAILER_CLIENT_SECRET: ${{ secrets.GOOGLE_NODEMAILER_CLIENT_SECRET }}
          GOOGLE_NODEMAILER_REFRESH_TOKEN: ${{ secrets.GOOGLE_NODEMAILER_REFRESH_TOKEN }}
          EASYPAY_ACCOUNT_ID: ${{ secrets.EASYPAY_ACCOUNT_ID }}
          EASYPAY_API_KEY: ${{ secrets.EASYPAY_API_KEY }}
          EASYPAY_API_URL: ${{ secrets.EASYPAY_API_URL }}
          EASYPAY_WEBHOOK_SECRET: ${{ secrets.EASYPAY_WEBHOOK_SECRET }}
          PERSONAL_GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          NEXT_PUBLIC_CARTO_BASEMAP_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_BASEMAP_KEY }}
          # The admin Translate view calls LIBRETRANSLATE_URL and silently fell back to
          # http://localhost:5000 in production, failing on every use. GEOCODING_CONTACT_EMAIL
          # has a working fallback but the same gap.
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
          LIBRETRANSLATE_API_KEY: ${{ secrets.LIBRETRANSLATE_API_KEY }}
          GEOCODING_CONTACT_EMAIL: ${{ secrets.GEOCODING_CONTACT_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          envs: NEXT_PUBLIC_APP_URL,PAYLOAD_SECRET,SENTRY_AUTH_TOKEN,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REFRESH_TOKEN,GOOGLE_REDIRECT_URI,GOOGLE_DRIVE_FOLDER_ID,GOOGLE_EMAIL_USER,GOOGLE_NODEMAILER_CLIENT_ID,GOOGLE_NODEMAILER_CLIENT_SECRET,GOOGLE_NODEMAILER_REFRESH_TOKEN,EASYPAY_ACCOUNT_ID,EASYPAY_API_KEY,EASYPAY_API_URL,EASYPAY_WEBHOOK_SECRET,PERSONAL_GITHUB_TOKEN,NEXT_PUBLIC_CARTO_BASEMAP_KEY,LIBRETRANSLATE_URL,LIBRETRANSLATE_API_KEY,GEOCODING_CONTACT_EMAIL
          script: |
            set -e

            # Non-interactive shell: let pnpm purge node_modules without a TTY prompt
            export CI=true

            git config --global url."https://${PERSONAL_GITHUB_TOKEN}:@github.com".insteadOf "https://github.com"
            cd app/

            # nginx.conf is tracked in the repo but may exist untracked on the server,
            # which makes `git pull` abort. Drop any local working-tree changes/untracked
            # tracked files so the pull always fast-forwards cleanly.
            git fetch origin main
            git checkout -- . 2>/dev/null || true
            git reset --hard origin/main
            git config --global --unset url."https://${PERSONAL_GITHUB_TOKEN}:@github.com".insteadOf


            # Remove the old get.pnpm.io installation — its self-installed
            # launcher kept breaking (exit 127) and would shadow the
            # npm-managed pnpm below if left on PATH. Keeps the package store.
            rm -f "$HOME/.local/share/pnpm/pnpm" "$HOME/.local/share/pnpm/pnpmx"
            rm -rf "$HOME/.local/share/pnpm/global"

            # Install/auto-update pnpm via npm (ships with Node). "pnpm@11"
            # tracks the latest 11.x on every deploy, matching the v11 pin in
            # the check job. Bump both together for a major upgrade.
            npm install -g pnpm@11

            # Verify pnpm is available
            pnpm --version

            # Create .env file dynamically
            cat > .env << EOF
            NODE_ENV=production
            NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
            PAYLOAD_SECRET=${PAYLOAD_SECRET}
            DATABASE_URI=mongodb://localhost:27017/hawkstars
            SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
            GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
            GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
            GOOGLE_EMAIL_USER=${GOOGLE_EMAIL_USER}
            GOOGLE_NODEMAILER_CLIENT_ID=${GOOGLE_NODEMAILER_CLIENT_ID}
            GOOGLE_NODEMAILER_CLIENT_SECRET=${GOOGLE_NODEMAILER_CLIENT_SECRET}
            GOOGLE_NODEMAILER_REFRESH_TOKEN=${GOOGLE_NODEMAILER_REFRESH_TOKEN}
            EASYPAY_ACCOUNT_ID=${EASYPAY_ACCOUNT_ID}
            EASYPAY_API_KEY=${EASYPAY_API_KEY}
            EASYPAY_API_URL=${EASYPAY_API_URL}
            EASYPAY_WEBHOOK_SECRET=${EASYPAY_WEBHOOK_SECRET}
            NEXT_PUBLIC_CARTO_BASEMAP_KEY=${NEXT_PUBLIC_CARTO_BASEMAP_KEY}
            LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL}
            LIBRETRANSLATE_API_KEY=${LIBRETRANSLATE_API_KEY}
            GEOCODING_CONTACT_EMAIL=${GEOCODING_CONTACT_EMAIL}
            EOF

            # Restrict permissions so only owner can read
            chmod 600 .env

            # Build BEFORE touching the running process. The previous order
            # (pm2 stop -> pm2 delete -> rm -rf .next -> build) took the site down
            # first, so any build or migrate failure left `hawkstars` deleted from
            # PM2 with no .next and no way back except manual SSH.
            #
            # Install dependencies (CI=true above lets pnpm purge node_modules
            # non-interactively if the store layout changed).
            pnpm install --frozen-lockfile

            # Build into a staging directory so the live .next keeps serving.
            rm -rf .next.new
            if ! NEXT_DIST_DIR=.next.new pnpm build; then
              echo "::error::build failed — leaving the running deployment untouched"
              rm -rf .next.new
              exit 1
            fi

            # Run database migrations (if any). No-op when there are none.
            if ! pnpm migrate; then
              echo "::error::migrate failed — leaving the running deployment untouched"
              rm -rf .next.new
              exit 1
            fi

            # Swap the new build in. Keep the previous one for rollback below.
            rm -rf .next.prev
            [ -d .next ] && mv .next .next.prev
            mv .next.new .next

            # Reload rather than stop/delete: PM2 keeps the process list intact, and
            # in cluster mode workers are replaced one at a time with no dropped
            # requests. Falls back to a start when the app isn't running yet.
            # ecosystem.config.cjs runs `next` directly and pins cwd to an absolute
            # path — `pm2 start npm -- start` inherited the daemon's cwd and
            # crash-looped with ENOENT /root/package.json.
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

            # QUA-4: confirm the process is actually serving and can reach the DB
            # before calling this a success. /api/health exists for exactly this.
            if ! curl -fsS --retry 12 --retry-delay 5 --retry-connrefused \
                 --max-time 20 http://127.0.0.1:3000/api/health > /dev/null; then
              echo "::error::health check failed — rolling back to the previous build"
              if [ -d .next.prev ]; then
                rm -rf .next
                mv .next.prev .next
                pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
              fi
              exit 1
            fi

            rm -rf .next.prev

            # Persist the process list so a reboot/resurrect keeps the correct cwd.
            pm2 save

      - name: Update deployment Status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: 'success'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: 'failure'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: check
    # Run even when the deploy fails or is cancelled, so the channel always
    # reflects the real state of production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # docs https://pnpm.io/continuous-integration#github-actions
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile
        #👇 Adds Chromatic as a step in the workflow

      - uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186
        # Options required for Chromatic's GitHub Action
        with:
          #👇 Chromatic projectToken, see https://storybook.js.org/tutorials/intro-to-storybook/react/en/deploy/ to obtain it
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: deploy
    # Run even when the deploy fails or is cancelled, so the channel always
    # reflects the real state of production.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Send deployment status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://hawkstars.org
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL is not set — skipping Discord notification."
            exit 0
          fi

          case "${DEPLOY_STATUS}" in
            success)   TITLE="✅ Deployed to production"; COLOR=3066993 ;;
            failure)   TITLE="❌ Deploy failed";          COLOR=15158332 ;;
            cancelled) TITLE="⚪ Deploy cancelled";       COLOR=9807270 ;;
            *)         TITLE="⚠️ Deploy skipped";         COLOR=16776960 ;;
          esac

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MESSAGE="$(git log -1 --pretty=%s "${COMMIT_SHA}" 2>/dev/null || git log -1 --pretty=%s)"

          # Build the payload with jq so commit messages containing quotes,
          # backslashes or newlines can't break the JSON.
          jq -n \
            --arg title "${TITLE}" \
            --argjson color "${COLOR}" \
            --arg description "[\`${SHORT_SHA}\`](${REPO_URL}/commit/${COMMIT_SHA}) ${COMMIT_MESSAGE}" \
            --arg branch "${BRANCH}" \
            --arg actor "${ACTOR}" \
            --arg run_url "${RUN_URL}" \
            --arg site_url "${SITE_URL}" \
            '{
              username: "HawkStars Deploys",
              embeds: [{
                title: $title,
                color: $color,
                description: $description,
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Author", value: $actor, inline: true },
                  { name: "Links", value: "[Workflow run](\($run_url)) · [hawkstars.org](\($site_url))" }
                ],
                timestamp: (now | todate)
              }]
            }' > payload.json

          # --fail-with-body so a rejected webhook (bad URL, rate limit) fails
          # the step loudly instead of passing silently.
          curl --silent --show-error --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "${DISCORD_WEBHOOK_URL}"
