# Actions are now SHA-pinned (deploy.yml, db-backup.yml). Pinning without an
# update path just means they rot, so Dependabot moves the pins and leaves the
# trailing `# vN` comment intact.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
