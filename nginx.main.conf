# =============================================================================
#  /etc/nginx/nginx.conf on the VPS — reference copy
# =============================================================================
#  This is NOT deployed by CI. It is committed so the two shared-memory zones
#  that `nginx.conf` (the site config, /etc/nginx/sites-enabled/hawkstars) uses
#  but does not declare are reviewable from the repo instead of existing only on
#  the box, where any change is lost on re-provision.
#
#  Captured 2026-09-17. If you change the live file, update this one too:
#    sudo nginx -T | grep -n -E 'limit_req_zone|proxy_cache_path'
#
#  Do NOT move these declarations into the site config — they are already here,
#  and declaring a zone twice is a hard startup failure:
#    [emerg] the size 52428800 of shared memory zone "assets_cache" conflicts
#            with already declared size 20971520
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        # Where nginx stores cached responses on disk.
        # Referenced as `proxy_cache assets_cache` in four location blocks of the
        # site config.
        proxy_cache_path /var/cache/nginx/hawkstars levels=1:2 keys_zone=assets_cache:20m
                 max_size=2g inactive=30d use_temp_path=off;

        # Rate Limit.
        # Referenced as `limit_req zone=mylimit burst=60;` in the site config's
        # `location /` — so document/RSC requests are released at 10/s per IP with
        # a 60-request queue. See the note in the site config about `nodelay`.
        limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        # NOTE: TLS 1.0 and 1.1 are deprecated (RFC 8996). Every server block in
        # the site config includes /etc/letsencrypt/options-ssl-nginx.conf, which
        # sets ssl_protocols at server level and therefore overrides this — so
        # this line is currently inert. It is still worth narrowing to
        # `TLSv1.2 TLSv1.3` here, so a future server block that forgets the
        # include does not silently inherit TLS 1.0.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##

        # `gzip on` is already set here, which is why the site config sets its
        # gzip_* directives at SERVER level: a duplicate `gzip` directive in the
        # same context is a startup error, the same class of failure as the
        # shared-zone conflict above.
        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
}
