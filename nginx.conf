# =============================================================================
#  hawkstars.org
# =============================================================================
#  NOTE ON CONTEXT: `upstream` below belongs to the http{} context. It is legal
#  at the top of this file ONLY because this file is included from http{} in
#  /etc/nginx/nginx.conf.
# =============================================================================

# -----------------------------------------------------------------------------
#  SHARED MEMORY ZONES — declared in /etc/nginx/nginx.conf, NOT here.
#
#  This file references two zones it does not declare:
#    * `limit_req zone=mylimit` (in the `location /` block below)
#    * `proxy_cache assets_cache` (in four location blocks below)
#
#  Both live in /etc/nginx/nginx.conf, a reference copy of which is committed
#  next to this file as `nginx.main.conf`. Declaring them here as well is a hard
#  startup failure, not an override — nginx refuses to start:
#
#    [emerg] the size 52428800 of shared memory zone "assets_cache" conflicts
#            with already declared size 20971520
#
#  Live values (VPS, 2026-09-17):
#    proxy_cache_path /var/cache/nginx/hawkstars levels=1:2
#                     keys_zone=assets_cache:20m max_size=2g inactive=30d
#                     use_temp_path=off;
#    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
#
#  To re-read them, and to see which file they come from:
#    sudo nginx -T | grep -n -E 'limit_req_zone|proxy_cache_path'
#
#  Keep nginx.main.conf in step with the box when either value changes.
# -----------------------------------------------------------------------------

# Named upstream so we can pool keepalive connections to the Node app instead
# of opening a fresh TCP connection for every single request.
upstream app {
    server 127.0.0.1:3000;
    keepalive 64;
    keepalive_timeout 60s;
}

# -----------------------------------------------------------------------------
#  Main HTTPS vhost
# -----------------------------------------------------------------------------
server {
    server_name hawkstars.org;

    listen 443 ssl http2;
    # listen [::]:443 ssl http2;          # uncomment if the box has IPv6
    # On nginx >= 1.25.1 the line above logs a deprecation warning. There, use:
    #     listen 443 ssl;
    #     http2 on;
    # Do NOT switch until you've confirmed the version — `http2 on;` is an
    # unknown directive on older builds and will refuse to start.

    ssl_certificate     /etc/letsencrypt/live/hawkstars.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hawkstars.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Matches the value next.config.ts sets. It has to be here as well as in
    # the app: the app's copy rides only on responses that reach Node, so the
    # redirects below and nginx's own 404s carried no HSTS at all while
    # next.config.ts was advertising `preload`.
    #   ^ an add_header in a location block discards server-level ones, so any
    #     location that adds its own headers must repeat this.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 50M;

    # Compression was left entirely to Next's built-in gzip, so the Node process
    # spent CPU on it and responses nginx generates itself (redirects, 404s,
    # rate-limit rejections) were not compressed at all.
    #
    # Declared at server level, not http: the stock /etc/nginx/nginx.conf already
    # has `gzip on;` in http, and a duplicate directive in the same context is a
    # startup error just like the shared-zone conflict above. Server level
    # overrides the inherited value cleanly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml application/atom+xml image/svg+xml
               application/manifest+json;

    # -- Shared proxy settings ------------------------------------------------
    # Declared once at server level and inherited by every location. Caveat:
    # proxy_set_header is "replace all, not merge" — if any location adds its
    # own proxy_set_header, it loses ALL of these and must restate them.
    proxy_http_version 1.1;
    proxy_set_header Connection "";              # enables upstream keepalive
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -- Let's Encrypt challenge ---------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        access_log off;
    }

    location ~* \.php$ {
        return 404;
    }

    # -- Immutable build output ----------------------------------------------
    # Next.js content-hashes everything under /_next/static/, so a 1-year
    # immutable TTL is safe: the filename changes when the content does.
    # DELETE THIS BLOCK if the app isn't Next.js.
    location /_next/static/ {
        proxy_pass http://app;

        proxy_cache assets_cache;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        # No Cache-Control here: Next already sends
        # `public, max-age=31536000, immutable` on /_next/static/, and
        # `add_header` appends rather than replaces, so this emitted it twice.
        # `proxy_ignore_headers Cache-Control` above only changes nginx's own
        # caching decision; it does not strip the header from the response.
        access_log off;
    }

    # -- On-the-fly optimized images -----------------------------------------
    # THIS is the block that was missing. /_next/image?url=...&w=640&q=75 has
    # no file extension in its path, so it never matched the regex locations
    # below — it fell through to `location /` and got hit by the rate limiter's
    # `delay=10`, which is what staircases images in on image-heavy pages.
    # The default cache key already includes the query string, so each
    # width/quality variant is cached separately. DELETE IF NOT Next.js.
    location /_next/image {
        proxy_pass http://app;

        proxy_cache assets_cache;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        expires 30d;
    }

    # -- Static images -------------------------------------------------------
    # Matches on the path only; a query string like ?v=2 doesn't break it.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        proxy_pass http://app;

        proxy_cache assets_cache;
        proxy_cache_valid 200 301 302 30d;

        # Collapse a thundering herd on a MISS into one upstream request.
        # The 5s default lock timeout meant every other client could sit and
        # wait up to five seconds; 2s bounds the damage.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Revalidate with If-Modified-Since instead of refetching whole bodies.
        proxy_cache_revalidate on;

        # If the app ever sets a cookie or no-store on an image response,
        # nginx silently refuses to cache it -> permanent 100% MISS. Override.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;

        # `expires 30d` emits Cache-Control: max-age=2592000 by itself — the
        # original config's extra add_header Cache-Control produced a duplicate
        # header. Pick one; this is the one.
        expires 30d;
        # Add ", immutable" ONLY if these filenames are content-hashed.
        # Otherwise a replaced image stays stale in browsers for a full month.
    }

    # -- CSS / JS / fonts ----------------------------------------------------
    location ~* \.(css|js|mjs|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://app;

        proxy_cache assets_cache;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        expires 30d;
    }

    # -- Everything else: the app, rate limited ------------------------------
    location / {
        # mylimit is 10r/s per IP (see nginx.main.conf). With burst=60 and no
        # `nodelay`, a burst is QUEUED and drained at 10/s rather than rejected —
        # so a visitor who trips it waits instead of seeing a 503. This location
        # proxies documents and RSC payloads only (static assets and images match
        # the earlier location blocks), so 10/s per IP is ample for real browsing
        # and the queue mostly absorbs prefetches. Add `nodelay` if you would
        # rather fail fast than add latency under load.
        limit_req zone=mylimit burst=60;

        proxy_pass http://app;

        # Websockets / HMR — harmless if unused, required if the app upgrades.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";     # keep upstream keepalive working

        proxy_read_timeout 180s;
    }
}

# -----------------------------------------------------------------------------
#  https://www -> https://non-www
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name www.hawkstars.org;

    ssl_certificate     /etc/letsencrypt/live/hawkstars.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hawkstars.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://hawkstars.org$request_uri;
}

# -----------------------------------------------------------------------------
#  http (both hosts) -> https://non-www
#  ACME is served directly here rather than redirected, so webroot renewals
#  work even if HTTPS is broken or the cert has already expired.
# -----------------------------------------------------------------------------
server {
    listen 80;
    # listen [::]:80;
    server_name hawkstars.org www.hawkstars.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        access_log off;
    }

    location / {
        # Same-host redirect: https://$host, not a hardcoded apex. HSTS preload
        # requires the http response to go to https on the *same* host; the
        # www -> apex hop then happens over https in the vhost above. Redirecting
        # http://www straight to the apex would fail preload submission.
        return 301 https://$host$request_uri;
    }
}